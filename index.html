<!doctype html>
<html lang="th" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Mood Journal</title>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
        body {
            box-sizing: border-box;
        }
        
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap');
        
        .space-bg {
            background: linear-gradient(135deg, #0c0c1e 0%, #1a1a3e 25%, #2d1b69 50%, #1a1a3e 75%, #0c0c1e 100%);
            position: relative;
            overflow: hidden;
        }
        
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 160px 30px, #fff, transparent);
            background-repeat: repeat;
            background-size: 200px 100px;
            animation: twinkle 4s ease-in-out infinite alternate;
        }
        
        @keyframes twinkle {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        
        .floating-planet {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.3);
            animation: float 6s ease-in-out infinite;
            top: 20%;
            right: 10%;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }
        
        .journal-container {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .cosmic-textarea {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(100, 200, 255, 0.3);
            color: #e0e0ff;
            font-family: 'Space Mono', monospace;
            transition: all 0.3s ease;
        }
        
        .cosmic-textarea:focus {
            border-color: rgba(100, 200, 255, 0.8);
            box-shadow: 0 0 20px rgba(100, 200, 255, 0.3);
            outline: none;
        }
        
        .cosmic-textarea::placeholder {
            color: rgba(224, 224, 255, 0.5);
        }
        
        .delete-btn {
            background: linear-gradient(45deg, #ff4757, #ff3742);
            border: none;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .delete-btn:hover {
            background: linear-gradient(45deg, #ff3742, #ff2f3a);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 71, 87, 0.4);
        }
        
        .delete-btn:active {
            transform: translateY(0);
        }
        
        .blackhole-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            pointer-events: none;
        }
        
        .blackhole {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, transparent 30%, #000 35%, #1a1a1a 50%, #000 80%);
            animation: blackhole-spin 2s linear infinite;
            position: relative;
            box-shadow: 
                0 0 50px rgba(0, 0, 0, 0.8),
                inset 0 0 50px rgba(255, 255, 255, 0.1);
        }
        
        .blackhole::before {
            content: '';
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 100, 100, 0.3), transparent, rgba(100, 100, 255, 0.3), transparent);
            animation: blackhole-spin 1s linear infinite reverse;
        }
        
        @keyframes blackhole-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .smoke {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            animation: smoke-rise 3s ease-out infinite;
        }
        
        @keyframes smoke-rise {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) scale(0);
                opacity: 0;
            }
        }
        
        .text-sucked {
            animation: suck-into-blackhole 2s ease-in forwards;
        }
        
        @keyframes suck-into-blackhole {
            0% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
            50% {
                transform: scale(0.8) rotate(180deg);
                opacity: 0.7;
            }
            100% {
                transform: scale(0) rotate(360deg);
                opacity: 0;
            }
        }
        
        .fade-out {
            animation: fadeOut 0.5s ease-out forwards;
        }
        
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        
        .cosmic-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            background: linear-gradient(45deg, #64c8ff, #a8e6cf, #ffd93d, #ff6b9d);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: cosmic-glow 3s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(100, 200, 255, 0.5);
        }
        
        @keyframes cosmic-glow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .entry-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(100, 200, 255, 0.2);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            color: #e0e0ff;
            font-family: 'Space Mono', monospace;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .entry-item:hover {
            border-color: rgba(100, 200, 255, 0.4);
            box-shadow: 0 4px 20px rgba(100, 200, 255, 0.1);
        }
        
        .entry-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .entry-timestamp {
            font-size: 0.75rem;
            color: rgba(224, 224, 255, 0.6);
        }
        
        .delete-single-btn {
            background: rgba(255, 71, 87, 0.2);
            border: 1px solid rgba(255, 71, 87, 0.3);
            color: #ff4757;
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0.7;
        }
        
        .delete-single-btn:hover {
            background: rgba(255, 71, 87, 0.3);
            border-color: rgba(255, 71, 87, 0.5);
            opacity: 1;
            transform: scale(1.1);
        }
        
        .delete-single-btn:active {
            transform: scale(0.95);
        }
        
        .entry-text {
            line-height: 1.6;
        }
    </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full">
  <div class="space-bg h-full min-h-full">
   <div class="stars"></div>
   <div class="floating-planet"></div>
   <main class="container mx-auto px-4 py-8 h-full">
    <div class="max-w-4xl mx-auto">
     <div class="flex justify-between items-center mb-8">
      <div></div>
      <h1 id="app-title" class="cosmic-title text-4xl md:text-6xl text-center">My Space Mood Journal</h1><button id="admin-login-btn" class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white px-4 py-2 rounded-lg transition-all duration-300 transform hover:scale-105" style="font-family: 'Orbitron', sans-serif; font-size: 0.875rem;"> 🔐 Admin </button>
     </div>
     <div class="journal-container rounded-2xl p-6 md:p-8 mb-8">
      <div class="mb-6"><label for="mood-input" class="block text-lg font-semibold text-white mb-3" style="font-family: 'Orbitron', sans-serif;"> Share your thoughts with the universe... </label> <textarea id="mood-input" class="cosmic-textarea w-full h-32 p-4 rounded-xl resize-none" placeholder="Share your thoughts with the universe..."></textarea>
      </div>
      <div class="flex flex-col sm:flex-row gap-4"><button id="save-btn" class="flex-1 bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 text-white font-bold py-3 px-6 rounded-xl transition-all duration-300 transform hover:scale-105" style="font-family: 'Orbitron', sans-serif;"> 🚀 Launch Thought </button> <button id="delete-all-btn" class="delete-btn py-3 px-6 rounded-xl"> 🕳️ <span id="delete-button-text">Clear All Thoughts</span> </button>
      </div>
     </div>
     <div id="entries-container" class="space-y-4"><!-- Entries will be displayed here -->
     </div>
    </div>
   </main>
   <div id="blackhole-container" class="blackhole-container" style="display: none;">
    <div class="blackhole"></div>
   </div><!-- Admin Login Modal -->
   <div id="admin-login-modal" class="fixed inset-0 bg-black bg-opacity-50 backdrop-blur-sm z-50 flex items-center justify-center" style="display: none;">
    <div class="journal-container rounded-2xl p-6 max-w-md w-full mx-4">
     <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold text-white" style="font-family: 'Orbitron', sans-serif;">🔐 Admin Login</h2><button id="close-login-modal" class="text-white hover:text-red-400 text-2xl transition-colors">×</button>
     </div>
     <div class="space-y-4">
      <div><label class="block text-white mb-2" style="font-family: 'Space Mono', monospace;">Username:</label> <input id="admin-username" type="text" class="cosmic-textarea w-full p-3 rounded-lg" placeholder="Enter username">
      </div>
      <div><label class="block text-white mb-2" style="font-family: 'Space Mono', monospace;">Password:</label> <input id="admin-password" type="password" class="cosmic-textarea w-full p-3 rounded-lg" placeholder="Enter password">
      </div><button id="login-submit" class="w-full bg-gradient-to-r from-green-500 to-blue-600 hover:from-green-600 hover:to-blue-700 text-white font-bold py-3 px-6 rounded-lg transition-all duration-300" style="font-family: 'Orbitron', sans-serif;"> Login </button>
     </div>
    </div>
   </div><!-- Admin Panel Modal -->
   <div id="admin-panel-modal" class="fixed inset-0 bg-black bg-opacity-50 backdrop-blur-sm z-50 flex items-center justify-center overflow-y-auto py-4" style="display: none;">
    <div class="journal-container rounded-2xl p-6 max-w-lg w-full mx-4 my-auto max-h-full overflow-y-auto">
     <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold text-white" style="font-family: 'Orbitron', sans-serif;">⚙️ Admin Panel</h2><button id="close-admin-panel" class="text-white hover:text-red-400 text-2xl transition-colors">×</button>
     </div>
     <div class="space-y-6">
      <div><label class="block text-white mb-2" style="font-family: 'Space Mono', monospace;">จำนวนโพสต์สูงสุด:</label> <input id="max-posts" type="number" min="1" max="100" value="10" class="cosmic-textarea w-full p-3 rounded-lg">
      </div>
      <div><label class="block text-white mb-2" style="font-family: 'Space Mono', monospace;">สีข้อความ:</label>
       <div class="grid grid-cols-4 gap-3"><button class="text-color-btn w-12 h-12 rounded-lg border-2 border-transparent hover:border-white transition-all" style="background-color: #e0e0ff;" data-color="#e0e0ff" title="สีเดิม"></button> <button class="text-color-btn w-12 h-12 rounded-lg border-2 border-transparent hover:border-white transition-all" style="background-color: #ff6b9d;" data-color="#ff6b9d" title="ชมพู"></button> <button class="text-color-btn w-12 h-12 rounded-lg border-2 border-transparent hover:border-white transition-all" style="background-color: #64c8ff;" data-color="#64c8ff" title="ฟ้า"></button> <button class="text-color-btn w-12 h-12 rounded-lg border-2 border-transparent hover:border-white transition-all" style="background-color: #a8e6cf;" data-color="#a8e6cf" title="เขียว"></button> <button class="text-color-btn w-12 h-12 rounded-lg border-2 border-transparent hover:border-white transition-all" style="background-color: #ffd93d;" data-color="#ffd93d" title="เหลือง"></button> <button class="text-color-btn w-12 h-12 rounded-lg border-2 border-transparent hover:border-white transition-all" style="background-color: #ff9f43;" data-color="#ff9f43" title="ส้ม"></button> <button class="text-color-btn w-12 h-12 rounded-lg border-2 border-transparent hover:border-white transition-all" style="background-color: #c44569;" data-color="#c44569" title="แดง"></button> <button class="text-color-btn w-12 h-12 rounded-lg border-2 border-transparent hover:border-white transition-all" style="background-color: #ffffff;" data-color="#ffffff" title="ขาว"></button>
       </div>
      </div>
      <div class="border-t border-gray-600 pt-4">
       <h3 class="text-lg font-bold text-white mb-4" style="font-family: 'Orbitron', sans-serif;">🚀 ส่งข้อความหลายครั้ง</h3>
       <div class="space-y-3">
        <div><label class="block text-white mb-2" style="font-family: 'Space Mono', monospace;">จำนวนครั้งที่จะส่ง:</label> <input id="bulk-count" type="number" min="1" max="100" value="1" class="cosmic-textarea w-full p-3 rounded-lg">
        </div>
        <div><label class="block text-white mb-2" style="font-family: 'Space Mono', monospace;">ข้อความที่จะส่ง:</label> <textarea id="bulk-message" class="cosmic-textarea w-full p-3 rounded-lg h-20 resize-none" placeholder="พิมพ์ข้อความที่ต้องการส่งหลายครั้ง..."></textarea>
        </div><button id="send-bulk" class="w-full bg-gradient-to-r from-orange-500 to-red-600 hover:from-orange-600 hover:to-red-700 text-white font-bold py-3 px-6 rounded-lg transition-all duration-300" style="font-family: 'Orbitron', sans-serif;"> 📤 ส่งข้อความ </button>
       </div>
      </div>
      <div class="text-center"><button id="apply-settings" class="bg-gradient-to-r from-green-500 to-blue-600 hover:from-green-600 hover:to-blue-700 text-white font-bold py-3 px-6 rounded-lg transition-all duration-300" style="font-family: 'Orbitron', sans-serif;"> ✅ Apply Settings </button>
      </div>
     </div>
    </div>
   </div>
  </div>
  <script>
        const defaultConfig = {
            app_title: "My Space Mood Journal",
            placeholder_text: "Share your thoughts with the universe...",
            delete_button_text: "Clear All Thoughts"
        };

        let entries = [];
        let maxPosts = 10;
        let textColor = '#e0e0ff';
        let selectedColorBtn = null;

        // Load entries from localStorage
        function loadEntries() {
            const saved = localStorage.getItem('spaceMoodEntries');
            if (saved) {
                entries = JSON.parse(saved);
                displayEntries();
            }
        }

        // Save entries to localStorage
        function saveEntries() {
            localStorage.setItem('spaceMoodEntries', JSON.stringify(entries));
        }

        // Display all entries
        function displayEntries() {
            const container = document.getElementById('entries-container');
            container.innerHTML = '';
            
            entries.forEach((entry, index) => {
                const entryDiv = document.createElement('div');
                entryDiv.className = 'entry-item';
                entryDiv.innerHTML = `
                    <div class="entry-header">
                        <div class="entry-timestamp">${new Date(entry.timestamp).toLocaleString('th-TH')}</div>
                        <button class="delete-single-btn" onclick="deleteSingleEntry(${index})" title="ลบข้อความนี้">
                            🗑️
                        </button>
                    </div>
                    <div class="entry-text" style="color: ${textColor};">${entry.text}</div>
                `;
                container.appendChild(entryDiv);
            });
        }

        // Add new entry
        function addEntry() {
            const input = document.getElementById('mood-input');
            const text = input.value.trim();
            
            if (text) {
                // Check max posts limit
                if (entries.length >= maxPosts) {
                    showNotification(`ไม่สามารถเพิ่มโพสต์ได้ เกินจำนวนสูงสุด ${maxPosts} โพสต์`, 'error');
                    return;
                }
                
                const entry = {
                    text: text,
                    timestamp: Date.now()
                };
                
                entries.unshift(entry); // Add to beginning
                saveEntries();
                displayEntries();
                input.value = '';
                
                // Add a little space effect
                input.style.transform = 'scale(0.98)';
                setTimeout(() => {
                    input.style.transform = 'scale(1)';
                }, 150);
            }
        }

        // Show notification
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `fixed top-4 right-4 z-50 p-4 rounded-lg text-white font-bold transition-all duration-300 transform translate-x-full`;
            notification.style.fontFamily = "'Space Mono', monospace";
            
            if (type === 'error') {
                notification.style.background = 'linear-gradient(45deg, #ff4757, #ff3742)';
            } else {
                notification.style.background = 'linear-gradient(45deg, #2ed573, #1e90ff)';
            }
            
            notification.textContent = message;
            document.body.appendChild(notification);
            
            // Animate in
            setTimeout(() => {
                notification.style.transform = 'translateX(0)';
            }, 100);
            
            // Animate out and remove
            setTimeout(() => {
                notification.style.transform = 'translateX(100%)';
                setTimeout(() => {
                    notification.remove();
                }, 300);
            }, 3000);
        }

        // Admin functions
        function showLoginModal() {
            document.getElementById('admin-login-modal').style.display = 'flex';
        }

        function hideLoginModal() {
            document.getElementById('admin-login-modal').style.display = 'none';
            document.getElementById('admin-username').value = '';
            document.getElementById('admin-password').value = '';
        }

        function showAdminPanel() {
            document.getElementById('admin-panel-modal').style.display = 'flex';
            document.getElementById('max-posts').value = maxPosts;
            updateColorSelection();
        }

        function hideAdminPanel() {
            document.getElementById('admin-panel-modal').style.display = 'none';
        }

        function updateColorSelection() {
            const colorBtns = document.querySelectorAll('.text-color-btn');
            colorBtns.forEach(btn => {
                if (btn.dataset.color === textColor) {
                    btn.style.borderColor = 'white';
                    btn.style.transform = 'scale(1.1)';
                    selectedColorBtn = btn;
                } else {
                    btn.style.borderColor = 'transparent';
                    btn.style.transform = 'scale(1)';
                }
            });
        }

        function attemptLogin() {
            const username = document.getElementById('admin-username').value;
            const password = document.getElementById('admin-password').value;
            
            if (username === 'Winning' && password === '143898') {
                hideLoginModal();
                showAdminPanel();
                showNotification('เข้าสู่ระบบแอดมินสำเร็จ! 🎉', 'success');
            } else {
                showNotification('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง', 'error');
            }
        }

        function applyAdminSettings() {
            const newMaxPosts = parseInt(document.getElementById('max-posts').value);
            
            if (newMaxPosts && newMaxPosts > 0 && newMaxPosts <= 100) {
                maxPosts = newMaxPosts;
                
                // If current entries exceed new limit, remove excess
                if (entries.length > maxPosts) {
                    entries = entries.slice(0, maxPosts);
                    saveEntries();
                    displayEntries();
                }
                
                hideAdminPanel();
                showNotification(`ตั้งค่าสำเร็จ! จำนวนโพสต์สูงสุด: ${maxPosts}, สีข้อความใหม่`, 'success');
            } else {
                showNotification('กรุณาใส่จำนวนโพสต์ระหว่าง 1-100', 'error');
            }
        }

        function sendBulkMessages() {
            const count = parseInt(document.getElementById('bulk-count').value);
            const message = document.getElementById('bulk-message').value.trim();
            
            if (!message) {
                showNotification('กรุณาใส่ข้อความที่ต้องการส่ง', 'error');
                return;
            }
            
            if (!count || count < 1 || count > 100) {
                showNotification('กรุณาใส่จำนวนระหว่าง 1-100', 'error');
                return;
            }
            
            // Check if adding bulk messages would exceed max posts
            if (entries.length + count > maxPosts) {
                const remaining = maxPosts - entries.length;
                showNotification(`ไม่สามารถส่งได้ เหลือที่ว่างเพียง ${remaining} โพสต์`, 'error');
                return;
            }
            
            // Add messages with slight delay for visual effect
            let addedCount = 0;
            const addInterval = setInterval(() => {
                if (addedCount >= count) {
                    clearInterval(addInterval);
                    showNotification(`ส่งข้อความสำเร็จ ${count} ครั้ง! 🎉`, 'success');
                    // Clear the bulk message form
                    document.getElementById('bulk-message').value = '';
                    document.getElementById('bulk-count').value = '1';
                    return;
                }
                
                const entry = {
                    text: message,
                    timestamp: Date.now() + addedCount // Add slight time difference
                };
                
                entries.unshift(entry);
                addedCount++;
                
                // Update display every 5 messages or at the end
                if (addedCount % 5 === 0 || addedCount === count) {
                    saveEntries();
                    displayEntries();
                }
            }, 50); // 50ms delay between each message
        }

        // Create smoke particles
        function createSmoke() {
            const container = document.getElementById('blackhole-container');
            
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const smoke = document.createElement('div');
                    smoke.className = 'smoke';
                    smoke.style.left = Math.random() * 200 + 'px';
                    smoke.style.top = Math.random() * 200 + 'px';
                    smoke.style.animationDelay = Math.random() * 2 + 's';
                    container.appendChild(smoke);
                    
                    setTimeout(() => {
                        smoke.remove();
                    }, 3000);
                }, i * 100);
            }
        }

        // Create mini smoke particles for single entry
        function createMiniSmoke(container) {
            for (let i = 0; i < 8; i++) {
                setTimeout(() => {
                    const smoke = document.createElement('div');
                    smoke.className = 'smoke';
                    smoke.style.left = Math.random() * 60 + 'px';
                    smoke.style.top = Math.random() * 60 + 'px';
                    smoke.style.animationDelay = Math.random() * 1 + 's';
                    smoke.style.animationDuration = '2s';
                    container.appendChild(smoke);
                    
                    setTimeout(() => {
                        smoke.remove();
                    }, 2000);
                }, i * 50);
            }
        }

        // Delete single entry with mini blackhole effect
        function deleteSingleEntry(index) {
            if (index < 0 || index >= entries.length) return;
            
            const entryElement = document.querySelectorAll('.entry-item')[index];
            if (!entryElement) return;
            
            // Create mini blackhole container
            const miniBlackholeContainer = document.createElement('div');
            miniBlackholeContainer.style.cssText = `
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 60px;
                height: 60px;
                z-index: 10;
                pointer-events: none;
            `;
            
            // Create mini blackhole effect
            const miniBlackhole = document.createElement('div');
            miniBlackhole.style.cssText = `
                width: 60px;
                height: 60px;
                border-radius: 50%;
                background: radial-gradient(circle, transparent 25%, #000 30%, #1a1a1a 45%, #000 75%);
                animation: blackhole-spin 1.5s linear infinite;
                position: relative;
                box-shadow: 
                    0 0 20px rgba(0, 0, 0, 0.8),
                    inset 0 0 20px rgba(255, 255, 255, 0.1);
            `;
            
            // Add spinning ring effect
            const ring = document.createElement('div');
            ring.style.cssText = `
                position: absolute;
                top: -8px;
                left: -8px;
                right: -8px;
                bottom: -8px;
                border-radius: 50%;
                background: conic-gradient(from 0deg, transparent, rgba(255, 100, 100, 0.4), transparent, rgba(100, 100, 255, 0.4), transparent);
                animation: blackhole-spin 0.8s linear infinite reverse;
            `;
            
            miniBlackhole.appendChild(ring);
            miniBlackholeContainer.appendChild(miniBlackhole);
            
            entryElement.style.position = 'relative';
            entryElement.appendChild(miniBlackholeContainer);
            
            // Create mini smoke effect
            createMiniSmoke(miniBlackholeContainer);
            
            // Add sucking animation
            entryElement.classList.add('text-sucked');
            
            // Remove entry after animation
            setTimeout(() => {
                entries.splice(index, 1);
                saveEntries();
                displayEntries();
            }, 1500);
        }

        // Delete all entries with blackhole effect
        function deleteAllEntries() {
            if (entries.length === 0) return;
            
            const blackholeContainer = document.getElementById('blackhole-container');
            const entriesContainer = document.getElementById('entries-container');
            
            // Show blackhole
            blackholeContainer.style.display = 'block';
            
            // Create smoke effect
            createSmoke();
            
            // Add sucking animation to all entries
            const entryElements = entriesContainer.querySelectorAll('.entry-item');
            entryElements.forEach((entry, index) => {
                setTimeout(() => {
                    entry.classList.add('text-sucked');
                }, index * 200);
            });
            
            // Clear entries after animation
            setTimeout(() => {
                entries = [];
                saveEntries();
                displayEntries();
                
                // Hide blackhole
                blackholeContainer.classList.add('fade-out');
                setTimeout(() => {
                    blackholeContainer.style.display = 'none';
                    blackholeContainer.classList.remove('fade-out');
                }, 500);
            }, 2500);

        document.getElementById('apply-settings').addEventListener('click', applyAdminSettings);
        document.getElementById('send-bulk').addEventListener('click', sendBulkMessages);

        // Color selection
        document.querySelectorAll('.text-color-btn').forEach(btn => {

                displayEntries(); // Refresh to show new color

        // Enter key for login
        document.getElementById('admin-password').addEventListener('keypress', function(e) {

                attemptLogin();

        document.getElementById('admin-login-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                hideLoginModal();
            }
        });

        document.getElementById('admin-panel-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                hideAdminPanel();
            }
        });

        // Element SDK implementation
        async function onConfigChange(config) {
            const appTitle = document.getElementById('app-title');
            const placeholderElements = document.querySelectorAll('#mood-input');
            const deleteButtonText = document.getElementById('delete-button-text');
            const label = document.querySelector('label[for="mood-input"]');
            
            if (appTitle) {
                appTitle.textContent = config.app_title || defaultConfig.app_title;
            }
            
            placeholderElements.forEach(element => {
                element.placeholder = config.placeholder_text || defaultConfig.placeholder_text;
            });
            
            if (label) {
                label.textContent = config.placeholder_text || defaultConfig.placeholder_text;
            }
            
            if (deleteButtonText) {
                deleteButtonText.textContent = config.delete_button_text || defaultConfig.delete_button_text;
            }
        }

        function mapToCapabilities(config) {
            return {
                recolorables: [],
                borderables: [],
                fontEditable: undefined,
                fontSizeable: undefined
            };
        }

        function mapToEditPanelValues(config) {
            return new Map([
                ["app_title", config.app_title || defaultConfig.app_title],
                ["placeholder_text", config.placeholder_text || defaultConfig.placeholder_text],
                ["delete_button_text", config.delete_button_text || defaultConfig.delete_button_text]
            ]);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadEntries();
            
            if (window.elementSdk) {
                window.elementSdk.init({
                    defaultConfig,
                    onConfigChange,
                    mapToCapabilities,
                    mapToEditPanelValues
                });
            }
        });
